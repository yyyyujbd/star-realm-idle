<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>星穹放置 · Star Realm Idle</title>
<style>
:root{
  --bg:#eef2f7; --bg2:#e6ecf4;
  --card:#ffffff; --border:#e3e9f2; --border2:#d3dde9;
  --text:#1f2937; --muted:#6b7280; --muted2:#98a2b3;
  --accent:#4f7cff; --accent2:#3b6bf0;
  --green:#16a34a; --red:#dc2626; --gold:#d97706;
  --radius:12px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); color:var(--text);
  background:radial-gradient(1200px 600px at 20% -10%,#ffffff 0%,var(--bg) 45%,var(--bg2) 100%);
  font-size:14px; -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cdd6e2;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b7c2d1;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== 布局 ===== */
#app{display:flex;flex-direction:column;height:100vh}
.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:var(--card);border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(16,24,40,.04);
  z-index:20; position:relative;
}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:.5px;user-select:none}
.logo .mark{font-size:24px}
.logo .sub{font-size:10px;color:var(--muted2);font-weight:600;letter-spacing:.3px}
.top-stats{display:flex;align-items:center;gap:6px;margin-left:14px;flex-wrap:nowrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
  background:#f4f7fb;border:1px solid var(--border);font-weight:700;font-size:13px;white-space:nowrap;
}
.chip .ic{font-size:15px}
.chip small{font-weight:600;color:var(--muted);font-size:11px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;
  background:#f4f7fb;border:1px solid var(--border);transition:.15s;
}
.icon-btn:hover{background:#e9eff8;border-color:var(--border2)}

.layout{flex:1;display:grid;grid-template-columns:236px 1fr 336px;min-height:0}

/* ===== 侧边栏 ===== */
.sidebar{background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:12px 10px}
.side-group{margin:14px 0 6px;padding:0 6px;font-size:11px;font-weight:700;color:var(--muted2);letter-spacing:1.5px}
.side-group:first-child{margin-top:2px}
.skill-item{
  display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer;
  position:relative;transition:background .12s;border:1px solid transparent;user-select:none;
}
.skill-item:hover{background:#f2f6fc}
.skill-item.active{background:#eef3ff;border-color:#dbe6ff}
.skill-item.active .skill-name{color:var(--accent2)}
.skill-ic{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:0 0 38px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);
}
.skill-meta{flex:1;min-width:0;display:flex;flex-direction:column}
.skill-name{font-weight:700;font-size:13px}
.skill-lv{font-size:11px;color:var(--muted);font-weight:600}
.skill-bar{position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px;background:#e6ecf4;overflow:hidden;margin:0 8px}
.skill-bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

/* ===== 主内容区 ===== */
.main{overflow-y:auto;padding:18px 20px 40px}
.view-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.view-icon{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex:0 0 58px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.view-title{flex:1;min-width:0}
.view-title h1{font-size:20px;font-weight:800}
.view-title .sub{color:var(--muted);font-size:12px;margin-top:2px}
.xp-track{margin-top:8px;height:8px;border-radius:8px;background:#e9eef6;overflow:hidden;max-width:520px}
.xp-track>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7c9dff);border-radius:8px;transition:width .3s}
.view-stats{display:flex;gap:8px;flex-wrap:wrap}

.action-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
}
.card.locked{opacity:.55;filter:grayscale(.4)}
.card.active-card{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.14),var(--shadow)}
.card-top{display:flex;align-items:center;gap:10px}
.card-ic{width:44px;height:44px;border-radius:11px;background:#f2f6fc;display:grid;place-items:center;font-size:24px;flex:0 0 44px}
.card-name{font-weight:800;font-size:14px}
.card-sub{font-size:11px;color:var(--muted);font-weight:600}
.card-lv{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.card-lv .req{color:var(--red)}
.card-lv .ok{color:var(--green)}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.kv b{color:var(--text);font-weight:700}
.io-list{display:flex;flex-direction:column;gap:3px;font-size:12px}
.io-row{display:flex;align-items:center;gap:6px}
.io-row .qty{font-weight:700}
.io-row .have{margin-left:auto;color:var(--muted2);font-size:11px}
.io-row .lack{color:var(--red);font-weight:700}
.tiny-ic{font-size:14px}
.card-progress{position:absolute;left:0;bottom:0;height:4px;width:100%;background:#eef2f8}
.card-progress>i{display:block;height:100%;background:var(--accent);width:0%;transition:width .15s linear}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:10px;
  font-weight:700;font-size:13px;transition:.15s;border:1px solid transparent;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:#f4f7fb;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:#e9eff8}
.btn-danger{background:#fff;border-color:#f3c8c8;color:var(--red)}
.btn-danger:hover{background:#fdecec}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn-block{width:100%}

/* 战斗 */
.combat-layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.arena{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px;display:flex;flex-direction:column;gap:14px;
}
.combatant{display:flex;align-items:center;gap:12px}
.combatant .face{width:56px;height:56px;border-radius:13px;background:#f2f6fc;display:grid;place-items:center;font-size:30px;flex:0 0 56px}
.combatant .who{flex:1;min-width:0}
.combatant .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.combatant .nm .tag{font-size:10px;font-weight:700;color:var(--muted);background:#f2f6fc;padding:2px 7px;border-radius:8px}
.hpbar{height:12px;border-radius:8px;background:#eef2f8;overflow:hidden;margin-top:6px;position:relative}
.hpbar>i{display:block;height:100%;border-radius:8px;transition:width .2s}
.hpbar.player>i{background:linear-gradient(90deg,#22c55e,#4ade80)}
.hpbar.monster>i{background:linear-gradient(90deg,#ef4444,#f87171)}
.hpbar .hp-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.vs{text-align:center;font-size:22px;font-weight:900;color:var(--muted2);line-height:0;margin:-4px 0}
.style-pick{display:flex;gap:8px}
.style-btn{
  flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:#f7fafd;font-weight:700;font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:.13s;
}
.style-btn .e{font-size:18px}
.style-btn.active{border-color:var(--accent);background:#eef3ff;color:var(--accent2)}
.fight-log{background:#0f172a;color:#cbd5e1;border-radius:10px;padding:10px 12px;height:150px;overflow-y:auto;font-size:12px;line-height:1.7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.fight-log .me{color:#86efac}.fight-log .mo{color:#fca5a5}.fight-log .sys{color:#93c5fd}.fight-log .loot{color:#fcd34d}.fight-log .pet{color:#c4b5fd}
.monster-list{display:flex;flex-direction:column;gap:9px}
.monster-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:11px 12px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:.13s;position:relative;overflow:hidden;
}
.monster-card:hover{border-color:#c9d8f0;background:#fbfdff}
.monster-card.active{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.12),var(--shadow)}
.monster-card .face{width:42px;height:42px;border-radius:10px;background:#f2f6fc;display:grid;place-items:center;font-size:22px;flex:0 0 42px}
.monster-card .info{flex:1;min-width:0}
.monster-card .nm{font-weight:800;font-size:13px}
.monster-card .st{font-size:11px;color:var(--muted)}
.monster-card .lv{margin-left:auto;font-weight:800;font-size:12px;color:var(--muted);white-space:nowrap}
.monster-card .lv .danger{color:var(--red)}

/* ===== 右侧面板 ===== */
.right{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.right-tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--border)}
.rtab{flex:1;padding:9px 4px;text-align:center;font-weight:700;font-size:13px;color:var(--muted);border-radius:9px 9px 0 0;border-bottom:2px solid transparent;transition:.13s}
.rtab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.rtab:hover{color:var(--text)}
.right-body{flex:1;overflow-y:auto;padding:14px}

/* 角色 */
.char-block{margin-bottom:16px}
.char-block h3{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.stat-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px}
.stat-row b{font-weight:800}
.stat-row .v{color:var(--accent2);font-weight:800}
.equip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.equip-slot{
  aspect-ratio:1;border-radius:11px;border:2px dashed var(--border2);background:#fafbfd;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.13s;position:relative;
}
.equip-slot:hover{border-color:#c4d4ef}
.equip-slot.filled{border-style:solid;border-color:var(--border);background:#fff;box-shadow:var(--shadow)}
.equip-slot .e{font-size:22px}
.equip-slot .slot-nm{font-size:9px;color:var(--muted2);font-weight:700}
.equip-slot .lvl{font-size:9px;color:var(--accent2);font-weight:800}
.buff-row{display:flex;align-items:center;gap:8px;padding:6px 9px;background:#f6f9fd;border-radius:9px;margin-bottom:6px;font-size:12px}
.buff-row .tm{margin-left:auto;color:var(--muted);font-weight:700;font-size:11px}

/* 背包 */
.bank-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bank-head .cnt{font-size:12px;color:var(--muted);font-weight:600}
.bank-search{width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--border);background:#f7fafd;font-family:inherit;font-size:13px;margin-bottom:10px;outline:none}
.bank-search:focus{border-color:var(--accent);background:#fff}
.bank-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bank-item{
  border:1px solid var(--border);border-radius:10px;background:#fff;padding:8px 6px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:.12s;box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.bank-item:hover{border-color:#c9d8f0;background:#fbfdff}
.bank-item .e{font-size:22px}
.bank-item .n{font-size:10px;text-align:center;line-height:1.2;color:var(--muted);font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bank-item .q{position:absolute;top:4px;right:6px;font-size:10px;font-weight:800;color:var(--accent2)}
.bank-item .eq-tag{position:absolute;top:4px;left:6px;font-size:9px;font-weight:800;color:#fff;background:var(--gold);border-radius:6px;padding:1px 5px}
.bank-empty{grid-column:1/-1;text-align:center;color:var(--muted2);padding:26px 0;font-size:13px}

/* 商店 */
.shop-note{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.shop-row{display:flex;align-items:center;gap:9px;padding:8px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;background:#fff}
.shop-row .e{font-size:20px}
.shop-row .nm{flex:1;font-size:12px;font-weight:700;min-width:0}
.shop-row .pr{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.shop-row .buy{flex:0 0 auto}
.fortune-box{padding:14px;border-radius:14px;background:linear-gradient(135deg,#fff7e6,#fff2d0);border:1px solid #f2d8a0;margin-bottom:12px}
.fortune-box .f-head{font-weight:800;font-size:14px;color:#b45309;display:flex;align-items:center;gap:8px}
.fortune-box .f-head .f-icon{font-size:22px}
.fortune-box .f-head .tag{font-size:10px;font-weight:700;color:#b45309;background:#fde9c0;padding:2px 8px;border-radius:8px}
.fortune-box .f-bonus{font-size:12px;color:#92400e;margin:8px 0 4px;line-height:1.7}
.fortune-box .f-cost{font-size:11px;color:#a16207;margin-bottom:10px}
.train-box{padding:14px;border-radius:14px;background:linear-gradient(135deg,#f0f7ff,#eaf2ff);border:1px solid #c9dcf7;margin-bottom:12px}
.train-box .f-head{font-weight:800;font-size:14px;color:#1d4ed8}
.train-box .f-bonus{font-size:12px;color:#3b5b8a;margin:6px 0 10px;line-height:1.6}
.train-row{display:flex;gap:8px}
.train-select{flex:1;padding:8px;border-radius:9px;border:1px solid var(--border);background:#fff;font-family:inherit;font-size:12px;min-width:0}
.offer-box{padding:14px;border-radius:14px;background:linear-gradient(135deg,#f3f0ff,#eae4ff);border:1px solid #d3c7f2;margin-bottom:12px}
.offer-box .f-head{font-weight:800;font-size:14px;color:#6d28d9;display:flex;align-items:center;gap:8px}
.offer-box .f-bonus{font-size:12px;color:#5b4a8a;margin:6px 0 10px;line-height:1.6}
.offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.offer-card{display:flex;align-items:center;gap:8px;padding:9px;border-radius:10px;background:#fff;border:1px solid #e4dcf7}
.offer-card .e{font-size:20px}
.offer-card .nm{flex:1;font-size:12px;font-weight:700;color:#3d3360;line-height:1.3}
.offer-card .nm small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.offer-card .btn{flex:0 0 auto;font-size:11px;padding:5px 8px}

/* ===== Tooltip / Toast / Modal ===== */
#tooltip{
  position:fixed;z-index:999;max-width:260px;background:#fff;border:1px solid var(--border);border-radius:11px;
  box-shadow:0 8px 30px rgba(16,24,40,.18);padding:11px 13px;font-size:12px;pointer-events:none;display:none;line-height:1.55;
}
#tooltip .tt-title{font-weight:800;font-size:13px;margin-bottom:3px;display:flex;align-items:center;gap:6px}
#tooltip .tt-desc{color:var(--muted)}
#tooltip .tt-stat{color:var(--accent2);font-weight:700}
#toasts{position:fixed;right:16px;bottom:16px;z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{
  background:#1f2937;color:#fff;padding:10px 15px;border-radius:11px;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(16,24,40,.25);animation:toastIn .25s ease;max-width:320px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#modal-wrap.show{display:flex}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(16,24,40,.3);width:440px;max-width:92vw;max-height:86vh;overflow-y:auto;padding:20px}
.modal h2{font-size:17px;font-weight:800;margin-bottom:6px}
.modal .m-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.offline-report{background:#f6f9fd;border-radius:11px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.8}
.offline-report b{color:var(--accent2)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.empty-hint{color:var(--muted2);text-align:center;padding:30px 0;font-size:13px}
.section-title{font-size:13px;font-weight:800;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
/* 里程碑 / 成就 / 任务 */
.milestones{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:16px}
.mile{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:#fafbfd;font-size:12px}
.mile .lv{font-weight:800;color:var(--muted);font-size:11px;white-space:nowrap}
.mile .d{flex:1;color:var(--muted)}
.mile .ok{color:var(--green);font-weight:800}
.mile.done{border-color:#bfe3c9;background:#f2fbf5}
.mile.done .d{color:var(--text)}
.mile.done .lv{color:var(--green)}
/* 工具栏 */
.tool-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tool-slot{flex:1;min-width:210px;display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:11px;border:2px dashed var(--border2);background:#fafbfd;cursor:pointer;transition:.13s}
.tool-slot:hover{border-color:#c4d4ef}
.tool-slot.filled{border-style:solid;border-color:var(--border);background:#fff;box-shadow:var(--shadow)}
.tool-slot .e{font-size:20px}
.tool-slot .tt{font-weight:700;font-size:13px}
.tool-slot .b{font-size:11px;color:var(--muted);margin-left:auto;text-align:right}
.tool-buff{font-size:11px;font-weight:700;color:#7fb069;background:#f2fbf5;border:1px solid #bfe3c9;padding:5px 9px;border-radius:8px}
/* 宠物 */
.pet-fight{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;background:#f6f3ff;border:1px solid #e2dbf8;font-size:12px;font-weight:700;margin:2px 0}
.pet-fight .tag{font-size:10px;font-weight:700;color:var(--muted);background:#fff;padding:2px 7px;border-radius:8px}
.pet-fight .pf-atk{margin-left:auto;color:var(--accent2);font-size:11px}
.pet-fight.empty{background:#fafbfd;border:1px dashed var(--border2);color:var(--muted2);font-weight:600}
.pet-active{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #c9d3f7;border-radius:12px;background:linear-gradient(135deg,#f4f6ff,#eef2ff);margin-bottom:12px}
.pet-active.empty{border-style:dashed;border-color:var(--border2);background:#fafbfd;color:var(--muted);font-size:12px}
.pa-face{width:50px;height:50px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:28px;flex:0 0 50px;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.pa-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

.ach-bonus-tag{display:inline-flex;align-items:center;gap:3px;margin-top:4px;font-size:10.5px;font-weight:800;color:#7c3aed;background:#f3ecff;border:1px solid #e0d4ff;padding:2px 7px;border-radius:7px;align-self:flex-start}

.task-card{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.03)}

button{touch-action:manipulation}

<div id="app">
  <header class="topbar">

<script>
'use strict';
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n){ n=Math.floor(n); if(n>=1e8) return (n/1e8).toFixed(2)+'亿'; if(n>=1e4) return (n/1e4).toFixed(1)+'万'; return n.toLocaleString('zh-CN'); }
function fmtTime(s){
  if(s<10 && s%1!==0) return s.toFixed(1)+'秒';
  s=Math.floor(s); if(s<60) return s+'秒';
  const m=Math.floor(s/60), r=s%60; if(m<60) return m+'分'+(r?r+'秒':'');
  const h=Math.floor(m/60), mm=m%60; return h+'小时'+(mm?mm+'分':'');
}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
/* 安全存储：沙箱 iframe 等环境会禁用 localStorage，自动降级为内存模式 */
const store=(()=>{
  try{ const t='__sr_probe'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return localStorage; }
  catch(e){
    const mem={};
    return { getItem:k=>(k in mem)?mem[k]:null, setItem:(k,v)=>{mem[k]=String(v);}, removeItem:k=>{delete mem[k];} };
  }
})();
const STORAGE_MEM = (()=>{ try{ localStorage.setItem('__sr_probe','1'); localStorage.removeItem('__sr_probe'); return false; }catch(e){ return true; } })();

/* ================= 数据：技能 ================= */
const SKILLS = [
  {id:'milking',        name:'采晶',   icon:'💠', group:'采集', color:'#8b5cf6'},
  {id:'foraging',       name:'采摘',   icon:'🌿', group:'采集', color:'#71cf8c'},
  {id:'woodcutting',    name:'伐木',   icon:'🌲', group:'采集', color:'#b08968'},
  {id:'mining',         name:'采矿',   icon:'⛏️', group:'采集', color:'#9aa3b2'},
  {id:'fishing',        name:'钓鱼',   icon:'🎣', group:'采集', color:'#4fa8d8'},
  {id:'cheesesmithing', name:'锻造',   icon:'⚒️', group:'生产', color:'#f2c14e'},
  {id:'crafting',       name:'制作',   icon:'🔨', group:'生产', color:'#d98e4a'},
  {id:'tailoring',      name:'裁缝',   icon:'🧵', group:'生产', color:'#e88fc7'},
  {id:'cooking',        name:'烹饪',   icon:'🍳', group:'生产', color:'#e56b6b'},
  {id:'brewing',        name:'冲泡',   icon:'🍵', group:'生产', color:'#7fb069'},
  {id:'alchemy',        name:'炼金',   icon:'⚗️', group:'生产', color:'#9b7bd4'},
  {id:'melee',          name:'近战',   icon:'⚔️', group:'战斗', color:'#d9534f'},
  {id:'ranged',         name:'远程',   icon:'🏹', group:'战斗', color:'#5cb85c'},
  {id:'magic',          name:'魔法',   icon:'🔮', group:'战斗', color:'#5b7bd4'},
  {id:'defence',        name:'防御',   icon:'🛡️', group:'战斗', color:'#7c8aa5'},
  {id:'hitpoints',      name:'生命',   icon:'❤️', group:'战斗', color:'#e04a8b'},
];
const SKILL_MAP = Object.fromEntries(SKILLS.map(s=>[s.id,s]));
const COMBAT_SKILLS = ['melee','ranged','magic','defence','hitpoints'];
const NON_COMBAT_SKILLS = SKILLS.filter(s=>s.group!=='战斗').map(s=>s.id);
const STYLES = [
  {id:'melee', name:'近战', icon:'⚔️'},
  {id:'ranged', name:'远程', icon:'🏹'},
  {id:'magic', name:'魔法', icon:'🔮'},
];

/* ================= 数据：物品 ================= */
const TIER = [
  {lvl:1,  val:2,  wdmg:3,  hd:2,  bd:4,  ld:3,  ad:1,  hp:0},
  {lvl:15, val:6,  wdmg:7,  hd:4,  bd:7,  ld:5,  ad:2,  hp:8},
  {lvl:30, val:15, wdmg:13, hd:7,  bd:12, ld:9,  ad:4,  hp:18},
  {lvl:50, val:35, wdmg:22, hd:11, bd:18, ld:14, ad:6,  hp:32},
  {lvl:70, val:80, wdmg:34, hd:16, bd:26, ld:20, ad:9,  hp:50},
];
const RES_LINES = {
  milk: {cat:'resource', names:['低级魔晶','精良魔晶','秘银魔晶','星辉魔晶','星核魔晶'], icons:['💎','💎','💎','💠','✨']},
  fiber:{cat:'resource', names:['植物纤维','亚麻纤维','魔法纤维','精灵纤维','星尘纤维'], icons:['🌿','🌿','🧶','🧶','✨']},
  herb: {cat:'resource', names:['野药草','月光草','火焰花','冰晶草','龙息草'], icons:['🌱','🌙','🌺','❄️','🐉']},
  log:  {cat:'resource', names:['橡木','桦木','枫木','红木','灵木'], icons:['🪵','🪵','🍁','🪵','🌳']},
  ore:  {cat:'resource', names:['铜矿','铁矿','银矿','金矿','秘银矿'], icons:['🟤','⚙️','🥈','🥇','💠']},
  fish: {cat:'resource', names:['河鱼','鲈鱼','鲑鱼','金枪鱼','龙鱼'], icons:['🐟','🐟','🍣','🐟','🐉']},
};
const MAT_LINES = {
  cheese:{cat:'material', names:['魔晶锭','精炼魔晶锭','秘银魔晶锭','星辉魔晶锭','星核魔晶锭'], icons:['🔷','🔷','🔷','🔷','🔶']},
  plank: {cat:'material', names:['橡木板','桦木板','枫木板','红木板','灵木板'], icons:['🪵','🪵','🪵','🪵','🪵']},
  cloth: {cat:'material', names:['粗布','亚麻布','魔法布','精灵布','星尘布'], icons:['🧵','🧵','🧵','🧵','🧵']},
};
const ITEMS = {};   // id -> {name,icon,cat,val}
(function buildItems(){
  for(const line in RES_LINES){
    const L=RES_LINES[line];
    L.names.forEach((nm,i)=>{ ITEMS[line+(i+1)] = {name:nm, icon:L.icons[i], cat:L.cat, val:TIER[i].val}; });
  }
  for(const line in MAT_LINES){
    const L=MAT_LINES[line];
    L.names.forEach((nm,i)=>{ ITEMS[line+(i+1)] = {name:nm, icon:L.icons[i], cat:L.cat, val:Math.round(TIER[i].val*2.2)}; });
  }
})();

/* 消耗品（食物/茶/药水）——也纳入 ITEMS，含 heal/buff 字段 */
const CONSUMABLE_DEFS = [];
function addConsumable(id,name,icon,cat,opt){ ITEMS[id]={name,icon,cat,val:opt.val||10,...opt}; CONSUMABLE_DEFS.push({id,...ITEMS[id]}); }

}

    act(skillId, id, nm, ITEMS[id].icon, t.lvl, 2+i*0.6, 8*(i+1), null, [{id, qty:1}]);
  }
}

    act(skillId, 'toolmake_'+skillId, '制造·'+TOOL_PREFIX[0]+B.name, B.icon, 5, 3, 12, R.make, [{id:'tool_'+skillId+'1', qty:1}]);
    // 逐阶升级：tier i → tier i+1（消耗当前阶工具 + 对应阶材料组合）
    for(let i=1;i<5;i++){
      const inMap={['tool_'+skillId+i]:1};
      const extra=(R.upgrade[i-1]||{});
      for(const k in extra) inMap[k]=extra[k];
      act(skillId, 'toolup_'+skillId+'_'+(i+1), '升级·'+TOOL_PREFIX[i]+B.name, B.icon, TIER[i].lvl, 4+i*0.5, 15*(i+1), inMap, [{id:'tool_'+skillId+(i+1), qty:1}]);
    }
  }
})();

function petFeedXp(itemId, pet){
  const it=ITEMS[itemId]; if(!it) return 0;
  let base = it.cat==='resource' ? Math.max(1, Math.round(it.val*3))
    : it.cat==='material' ? Math.max(1, Math.round(it.val*2))

  if(pet.prefer && itemId.startsWith(pet.prefer)) base=Math.round(base*1.5);

}

/* ================= 经验系统 ================= */
function xpForLevel(level){ return Math.floor(50*Math.pow(level,1.5)); }
const LEVEL_XP = (()=>{ const arr=[0]; let c=0; for(let l=1;l<=120;l++){ c+=xpForLevel(l); arr.push(c); } return arr; })();
function levelFromXp(xp){ let l=1; while(l<LEVEL_XP.length && xp>=LEVEL_XP[l]) l++; return Math.min(l,120); }
function xpIntoLevel(xp){ const l=levelFromXp(xp); return {level:l, into:xp-(LEVEL_XP[l-1]||0), need:(LEVEL_XP[l]||0)-(LEVEL_XP[l-1]||0)}; }

function passiveSpeed(skillId){

}

const SAVE_KEY='milky_cow_idle_v1';
function defaultState(){

    achievements:{}, tasks:[], stats:{gather:0, craft:0, sold:0, bought:0, consumed:0, fed:0, offlines:0, enchantOk:0, offerings:0, kills:{}, relicProduce:{}, relicDmgTaken:0, relicSkillXp:{}},
    tools:{}, enchants:{}, relics:{}, relicReady:{},
    fortune:{level:0}, perma:{},

function defaultPets(){
  const pets={};
  PETS.forEach(p=>{ pets[p.id]={owned:!!p.initial, level:1, xp:0, stage:1}; });

}
let state = loadState();

function mergeState(s){
  const d=defaultState();
  const out={...d, ...s};
  out.skills={...d.skills, ...(s.skills||{})};
  out.bank=s.bank||{}; out.equipment=s.equipment||{}; out.buffs=s.buffs||{}; out.log=s.log||[];
  out.combat={...d.combat, ...(s.combat||{})};
  out.action=s.action||null;
  out.achievements=s.achievements||{};
  out.tasks=(Array.isArray(s.tasks)&&s.tasks.length)?s.tasks:[];
  out.stats={gather:0, craft:0, sold:0, bought:0, consumed:0, fed:0, offlines:0, enchantOk:0, offerings:0, kills:{}, relicProduce:{}, relicDmgTaken:0, relicSkillXp:{}, ...(s.stats||{})};
  out.stats.kills=(s.stats && s.stats.kills)||{};
  out.stats.relicProduce=(s.stats && s.stats.relicProduce)||{};
  out.stats.relicSkillXp=(s.stats && s.stats.relicSkillXp)||{};
  out.tools=s.tools||{};
  out.enchants=s.enchants||{};
  out.relics=s.relics||{};
  out.relicReady=s.relicReady||{};
  out.fortune={level:0, ...(s.fortune||{})};
  out.perma=s.perma||{};
  out.pets={...defaultPets(), ...(s.pets||{})};
  for(const id in out.pets){ if(!out.pets[id].stage) out.pets[id].stage=1; }
  if(out.activePet && (!out.pets[out.activePet] || !out.pets[out.activePet].owned)) out.activePet=null;
  return out;
}
function loadState(){
  try{
    const raw=store.getItem(SAVE_KEY);
    if(!raw) return defaultState();
    return mergeState(JSON.parse(raw));
  }catch(e){ return defaultState(); }
}
function saveState(){
  state.lastSave=Date.now();
  store.setItem(SAVE_KEY, JSON.stringify(state));
  renderTopbar();
}

/* ================= 云存档 (GitHub Gist) ================= */
const CLOUD_KEY='star_realm_cloud_v1';
const GIST_DESC='STAR_REALM_IDLE_SAVE';
const GIST_FILE='star-realm-idle-save.json';
let sessionToken=null;
function cloudGetConfig(){
  try{ return JSON.parse(store.getItem(CLOUD_KEY)||'{}'); }catch(e){ return {}; }
}
function cloudSetConfig(cfg){ store.setItem(CLOUD_KEY, JSON.stringify(cfg)); }
function cloudGetToken(){ return sessionToken || cloudGetConfig().token || null; }
async function gh(path, token, opts={}){
  const res=await fetch('https://api.github.com'+path, {
    method: opts.method||'GET',
    headers: {
      'Accept':'application/vnd.github+json',
      'Authorization':'Bearer '+token,
      'X-GitHub-Api-Version':'2022-11-28',
      ...(opts.body?{'Content-Type':'application/json'}:{}),
    },
    body: opts.body?JSON.stringify(opts.body):undefined,
  });
  if(!res.ok){
    let msg=res.status+' '+res.statusText;
    try{ const j=await res.json(); if(j.message) msg=j.message; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}
async function cloudFindGist(token){
  const gists=await gh('/gists?per_page=100', token);
  return gists.find(g=>g.description===GIST_DESC);
}
function cloudSaveToken(){
  const token=$('#cloud-token').value.trim();
  const remember=$('#cloud-remember').checked;
  if(!token){ toast('请先粘贴 Token'); return; }
  if(token.length<20){ toast('Token 太短，可能复制不完整'); return; }
  toast('正在验证 Token…');
  gh('/gists?per_page=1', token).then(()=>{
    if(remember){ cloudSetConfig({token, gistId:null, lastSync:null}); sessionToken=null; }
    else { cloudSetConfig({token:null, gistId:null, lastSync:null}); sessionToken=token; }
    toast('连接成功 ✅');
    renderRight();
  }).catch(e=>toast('连接失败：'+e.message));
}
async function cloudUpload(){
  const token=cloudGetToken();
  if(!token){ toast('请先连接 GitHub'); return; }
  saveState();
  const content=JSON.stringify(state);
  try{
    const g=await cloudFindGist(token);
    if(g){
      await gh('/gists/'+g.id, token, {method:'PATCH', body:{files:{[GIST_FILE]:{content}}}});
    } else {
      await gh('/gists', token, {method:'POST', body:{description:GIST_DESC, public:false, files:{[GIST_FILE]:{content}}}});
    }
    const cfg=cloudGetConfig(); cfg.lastSync=Date.now(); cloudSetConfig(cfg);
    toast('已上传到云端 ☁️');
    renderRight();
  }catch(e){ toast('上传失败：'+e.message); }
}
async function cloudDownload(){
  const token=cloudGetToken();
  if(!token){ toast('请先连接 GitHub'); return; }
  try{
    const g=await cloudFindGist(token);
    if(!g){ toast('云端还没有存档，先上传一次'); return; }
    const full=await gh('/gists/'+g.id, token);
    const file=full.files && full.files[GIST_FILE];
    if(!file || !file.content){ toast('云端存档为空或损坏'); return; }
    const data=JSON.parse(file.content);
    if(typeof data.gold!=='number' || !data.skills){ toast('云端存档格式无效'); return; }
    state=mergeState(data);
    saveState();
    const cfg=cloudGetConfig(); cfg.gistId=g.id; cfg.lastSync=Date.now(); cloudSetConfig(cfg);
    toast('已从云端下载存档 ⬇️');
    renderAll();
  }catch(e){ toast('下载失败：'+e.message); }
}
function cloudLogout(){
  showModal('断开云存档', `<div class="m-sub">确定断开 GitHub 连接吗？本机存档与云端存档都不会被删除。</div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-danger" onclick="doCloudLogout()">确认断开</button></div>`);
}
function doCloudLogout(){
  store.removeItem(CLOUD_KEY);

}

/* ================= 等级/经验 ================= */
function lvl(skillId){ return state.skills[skillId].level; }
function addGold(n){
  const v=Math.floor(n*(1+passiveGlobal('gold')+petBonus('gold')+achievementBonus('gold')+relicBonus('gold')+fortuneBonus('gold')+permaBonus('gold'))*buffMult('gold'));
  state.gold+=v; return v;
}
function addXp(skillId, amount, silent){
  const s=state.skills[skillId];
  const before=s.level;
  s.xp+=amount*(1+passiveGlobal('xp')+petBonus('xp')+achievementBonus('xp')+relicBonus('xp')+fortuneBonus('xp')+permaBonus('xp'))*buffMult('xp');
  state.stats.relicSkillXp[skillId]=(state.stats.relicSkillXp[skillId]||0)+amount;
  const after=levelFromXp(s.xp);
  if(after>before){
    s.level=after;
    if(!silent){ toast('🎉 '+SKILL_MAP[skillId].name+' 升到 '+after+' 级！'); checkAchievements(); updateTasks('level',{skillId}); }
  }
}

/* ================= 银行/物品 ================= */
function addItem(id, qty){ if(qty<=0) return; state.bank[id]=(state.bank[id]||0)+qty; }
function removeItem(id, qty){ const cur=state.bank[id]||0; state.bank[id]=Math.max(0,cur-qty); if(state.bank[id]===0) delete state.bank[id]; }
function countItem(id){ return state.bank[id]||0; }
function hasItems(map){ for(const k in map){ let have=state.bank[k]||0; if(TOOLS[k] && state.tools[TOOLS[k].skillId]===k) have++; if(have<map[k]) return false; } return true; }

/* ================= 装备 ================= */
function getEquipped(slot){ const id=state.equipment[slot]; return id?EQUIPMENT[id]:null; }
function equipItem(eqId){
  const E=EQUIPMENT[eqId];
  if(lvl('melee')<E.lvl && lvl('ranged')<E.lvl && lvl('magic')<E.lvl && lvl('defence')<E.lvl){ toast('等级不足，无法装备'); return; }
  const prev=state.equipment[E.slot];
  removeItem(eqId,1);
  if(prev){ addItem(prev,1); }
  state.equipment[E.slot]=eqId;
  toast('已装备 '+E.name);
  checkAchievements();
  saveState(); renderAll();
}
function unequip(slot){
  const id=state.equipment[slot]; if(!id) return;
  addItem(id,1); delete state.equipment[slot];
  toast('已卸下 '+EQUIPMENT[id].name);
  saveState(); renderAll();
}

function toolFor(skillId){ const id=state.tools[skillId]; return id?TOOLS[id]:null; }
function equipTool(toolId){

function pickTool(skillId){

/* ================= 装备强化 ================= */
function eqEnchant(eqId){ return state.enchants[eqId]||0; }
function eqStatMult(eqId){ return 1+0.08*eqEnchant(eqId); }
function enchantCost(eqId){
  const E=EQUIPMENT[eqId];
  let tier=1; for(let i=0;i<TIER.length;i++){ if(E.lvl<=TIER[i].lvl){ tier=i+1; break; } }
  const L=eqEnchant(eqId);
  return { stone:'stone'+tier, stoneQty:1+Math.floor(L/3), gold:Math.round(E.val*(0.5+L*0.5)) };
}
function enchantRate(L){ return Math.max(0.1, 1-0.1*L); }
function enchantItem(eqId){
  const E=EQUIPMENT[eqId];
  if(!E) return;
  if(state.equipment[E.slot]!==eqId){ toast('请先装备该装备'); return; }
  const L=eqEnchant(eqId);
  if(L>=10){ toast('已达最高强化等级 +10'); return; }
  const c=enchantCost(eqId);
  if(countItem(c.stone)<c.stoneQty){ toast('强化石不足（需要 '+ITEMS[c.stone].name+' ×'+c.stoneQty+'）'); return; }
  if(state.gold<c.gold){ toast('金币不足（需要 '+fmt(c.gold)+'）'); return; }
  removeItem(c.stone, c.stoneQty); state.gold-=c.gold;
  if(Math.random()<enchantRate(L)){
    state.enchants[eqId]=L+1;
    state.stats.enchantOk++;
    toast('✅ 强化成功！'+E.name+' → +'+(L+1));
    pushLog('强化成功：'+E.name+' +'+(L+1),'loot');
  } else {
    toast('❌ 强化失败，强化石与金币已消耗');
    pushLog('强化失败：'+E.name,'sys');
  }
  checkAchievements(); saveState(); renderAll();
}

/* ================= 宠物 ================= */
function activePet(){
  const id=state.activePet;
  if(!id) return null;
  const p=PET_MAP[id];
  if(!p || !state.pets[id] || !state.pets[id].owned) return null;
  return p;
}
function petLevel(){ const p=activePet(); return p?state.pets[p.id].level:0; }
function petStage(p){ return state.pets[p.id].stage || 1; }
function petStageDef(p){ return p.evolutions[petStage(p)-1]; }
function petMaxStage(p){ return p.evolutions.length; }
function petBonus(key){
  const p=activePet(); if(!p) return 0;
  const sd=petStageDef(p);
  return (p.bonus[key]||0) * state.pets[p.id].level * (sd.bonusMult||1);
}
function petDamage(){
  const p=activePet(); if(!p) return 0;
  const sd=petStageDef(p);
  return Math.floor((p.baseAtk + p.atkGrowth * state.pets[p.id].level) * (sd.atkMult||1) * (1+relicBonus('dmg')));
}
function petAtkInterval(){ const p=activePet(); return p?p.atkInterval:9999; }
function evolvePet(petId){
  const p=PET_MAP[petId];
  if(!p || !state.pets[petId] || !state.pets[petId].owned) return;
  const pd=state.pets[petId];
  const st=petStage(p);
  if(st>=petMaxStage(p)){ toast('已达最终形态'); return; }
  const next=p.evolutions[st];
  if(pd.level<next.level){ toast('需要 '+next.level+' 级才能进化'); return; }
  if(state.gold<next.cost.gold){ toast('金币不足'); return; }
  if(!hasItems(next.cost.items)){ toast('进化材料不足'); return; }
  state.gold-=next.cost.gold;
  for(const k in next.cost.items) removeItem(k, next.cost.items[k]);
  pd.stage=st+1;
  const sd=petStageDef(p);
  toast('🎉 '+p.name+' 进化为 '+sd.name+'！');
  pushLog('宠物进化：'+p.icon+' '+p.name+' → '+sd.icon+' '+sd.name,'loot');
  checkAchievements();
  saveState(); renderAll();
}
function setActivePet(petId){
  const p=PET_MAP[petId];
  if(!p || !state.pets[petId] || !state.pets[petId].owned){ toast('尚未拥有该宠物'); return; }
  state.activePet = (state.activePet===petId) ? null : petId;
  toast(state.activePet ? (p.icon+' '+p.name+' 已出战') : '宠物已收回');
  saveState(); renderAll();
}
function unlockPet(petId){
  const p=PET_MAP[petId]; if(!p || !p.unlock) return;
  if(state.pets[petId].owned){ toast('已拥有该宠物'); return; }
  if(state.gold<p.unlock.gold){ toast('金币不足'); return; }
  if(!hasItems(p.unlock.items)){ toast('材料不足'); return; }
  state.gold-=p.unlock.gold;
  for(const k in p.unlock.items) removeItem(k, p.unlock.items[k]);
  state.pets[petId].owned=true;
  state.pets[petId].level=1; state.pets[petId].xp=0;
  toast('🎉 解锁宠物 '+p.name+'！');
  pushLog('解锁宠物：'+p.icon+' '+p.name,'loot');
  saveState(); renderAll();
}
function feedPet(petId){
  const p=PET_MAP[petId];

  if(state.pets[petId].level>=PET_MAX_LEVEL){ toast('宠物已达满级 '+PET_MAX_LEVEL+' 级'); return; }
  const food=Object.keys(state.bank).filter(k=>(state.bank[k]>0) && ITEMS[k] && (ITEMS[k].cat==='resource' || ITEMS[k].cat==='material'));
  if(!food.length){ toast('背包没有可喂食的采集资源/材料'); return; }
  const items=food.map(id=>{
    const xp=petFeedXp(id, p), have=countItem(id);
    return `<div class="shop-row">
      <span class="e">${ITEMS[id].icon}</span>
      <span class="nm">${esc(ITEMS[id].name)}<br><small style="color:var(--muted)">经验 +${xp}${p.prefer&&id.startsWith(p.prefer)?'（偏好 ×1.5）':''}</small></span>
      <span class="pr">拥有 ${fmt(have)}</span>
      <button class="btn btn-primary btn-sm" onclick="feedPetItem('${petId}','${id}',1);closeModal()">喂1</button>
      ${have>=10?`<button class="btn btn-ghost btn-sm" onclick="feedPetItem('${petId}','${id}',10);closeModal()">喂10</button>`:''}
    </div>`;
  }).join('');

}
function feedPetItem(petId, itemId, qty){
  const p=PET_MAP[petId];
  if(!p || !state.pets[petId] || !state.pets[petId].owned) return;
  const pd=state.pets[petId];
  if(pd.level>=PET_MAX_LEVEL){ toast('宠物已达满级'); return; }
  qty=Math.min(qty||1, countItem(itemId));
  if(qty<=0){ toast('物品不足'); return; }
  removeItem(itemId, qty);
  state.stats.fed++;
  const gained=petFeedXp(itemId, p)*qty;
  pd.xp+=gained;
  let leveled=0;
  while(pd.level<PET_MAX_LEVEL && pd.xp>=petXpNeed(pd.level)){
    pd.xp-=petXpNeed(pd.level);
    pd.level++; leveled++;
  }
  if(pd.level>=PET_MAX_LEVEL) pd.xp=0;
  if(leveled>0){
    toast('🎉 '+p.name+' 升到 '+pd.level+' 级！');
    pushLog('宠物升级：'+p.icon+' '+p.name+' → '+pd.level+' 级','loot');
  } else {
    toast(p.icon+' '+p.name+' 吸收 '+ITEMS[itemId].name+' ×'+qty+'，+'+gained+' 经验');
  }
  checkAchievements();
  saveState(); renderAll();
}

/* ================= 毕业神器 ================= */
function relicOwned(id){ return !!state.relics[id]; }
function relicCount(){ return Object.keys(state.relics).length; }
function relicBonus(type, skillId){
  let v=0;
  for(const id in state.relics){
    const r=RELICS_MAP[id]; if(!r) continue;
    (r.bonus||[]).forEach(b=>{
      if(b.type===type && (b.skillId===undefined || b.skillId===skillId)) v+=b.value;
    });
  }
  return v;
}
function grantRelic(id){
  const r=RELICS_MAP[id]; if(!r || state.relics[id]) return;
  if(r.trophy) removeItem(r.trophy, 1);
  delete state.relicReady[id];
  state.relics[id]=true;
  toast('🏆 获得神器：'+r.icon+' '+r.name+'！');
  pushLog('🏆 获得毕业神器：'+r.icon+' '+r.name,'loot');
  checkAchievements();
  saveState(); renderAll();
}
/* 激活神器：条件已满足且持有本职业特有道具时，消耗前置材料并解锁；缺道具则暂存待激活 */
function activateRelic(id){
  const r=RELICS_MAP[id]; if(!r || state.relics[id]) return;
  if(r.trophy && countItem(r.trophy)<=0){ state.relicReady[id]=true; return; }
  if(r.obtain.type==='fragment') removeItem(r.obtain.shardId, r.obtain.need);
  grantRelic(id);
}
function tryActivateReadyRelics(){
  for(const id in state.relicReady){
    const r=RELICS_MAP[id];
    if(r && state.relicReady[id] && !state.relics[id] && (!r.trophy || countItem(r.trophy)>0)) activateRelic(id);
  }
}
function craftRelic(id){
  const r=RELICS_MAP[id];
  if(!r || r.obtain.type!=='craft') return;
  if(state.relics[id]){ toast('已拥有该神器'); return; }
  if(lvl(r.skillId)<r.obtain.needLevel){ toast('需要 '+SKILL_MAP[r.skillId].name+' '+r.obtain.needLevel+' 级'); return; }
  if(r.trophy && countItem(r.trophy)<=0){ toast('缺少特有道具 '+ITEMS[r.trophy].name+'（该技能行动 0.001% 概率掉落）'); return; }
  const c=r.obtain.cost;
  if(state.gold<c.gold){ toast('金币不足'); return; }
  if(!hasItems(c.items)){ toast('材料不足'); return; }
  state.gold-=c.gold;
  for(const k in c.items) removeItem(k, c.items[k]);
  grantRelic(id);
}
function checkRelics(){
  RELICS.forEach(r=>{
    if(state.relics[r.id]) return;
    const o=r.obtain;
    if(o.type==='fragment' && countItem(o.shardId)>=o.need) activateRelic(r.id);
    else if(o.type==='produce' && (state.stats.relicProduce[r.id]||0)>=o.need) activateRelic(r.id);
    else if(o.type==='dmgTaken' && (state.stats.relicDmgTaken||0)>=o.need) activateRelic(r.id);
    else if(o.type==='skillXp' && (state.stats.relicSkillXp[r.id]||0)>=o.need) activateRelic(r.id);
  });
}

const BUFF_INFO = {

  dmg:     {name:'伤害提升', icon:'💥', desc:'战斗伤害提升'},

  acc:     {name:'命中率', icon:'🎯', desc:'命中率提升'},
};
function applyBuff(buff, mult, dur){
  const now=Date.now();
  const cur=state.buffs[buff];
  const baseUntil = cur && cur.until>now ? cur.until : now;
  state.buffs[buff]={until:baseUntil+dur*1000, mult:Math.max(cur?cur.mult:1, mult)};
}
function buffMult(buff){ const b=state.buffs[buff]; return (b && b.until>Date.now())?b.mult:1; }
/* 技能专属加成（职业茶） */
function applySkillBuff(skillId, speedMult, xpMult, dur){
  const key='sk_'+skillId, now=Date.now();
  const cur=state.buffs[key];
  const baseUntil = cur && cur.until>now ? cur.until : now;
  state.buffs[key]={until:baseUntil+dur*1000, speed:Math.max(cur?cur.speed:1, speedMult), xp:Math.max(cur?cur.xp:1, xpMult)};
}
function skillBuff(skillId){
  const b=state.buffs['sk_'+skillId];
  return (b && b.until>Date.now())?b:null;
}
function actionSpeedMult(skillId){
  const t=toolFor(skillId), sb=skillBuff(skillId);
  return buffMult('speed')*passiveSpeed(skillId)*(t?t.speed:1)*(sb?sb.speed:1)*(1+petBonus('speed')+achievementBonus('speed')+relicBonus('skillSpeed', skillId)+fortuneBonus('speed')+permaBonus('speed'));
}
function actionXpMult(skillId){
  const t=toolFor(skillId), sb=skillBuff(skillId);
  return (t?t.xp:1)*(sb?sb.xp:1)*(1+relicBonus('skillXp', skillId));
}
function cleanupBuffs(){ const now=Date.now(); for(const k in state.buffs) if(state.buffs[k].until<=now) delete state.buffs[k]; }
function useConsumable(itemId){
  const it=ITEMS[itemId]; if(!it || countItem(itemId)<=0) return;
  state.stats.consumed++;
  if(it.heal){
    const hp=state.combat.playerHp, max=playerStats().maxHP;
    if(hp>=max){ toast('生命值已满'); return; }
    removeItem(itemId,1);
    state.combat.playerHp=Math.min(max, hp+it.heal);
    pushLog('你使用了 '+it.name+'，恢复 '+it.heal+' 生命','sys');
    toast('❤️ +'+it.heal);
  } else if(it.buff){

    applyBuff(it.buff, it.mult, it.dur);
    toast('✨ '+BUFF_INFO[it.buff].name+' 已激活');
    pushLog('你使用了 '+it.name+'（'+BUFF_INFO[it.buff].name+'）','sys');

    pushLog('你使用了 '+it.name+'（'+SKILL_MAP[it.skillId].name+' 速度+经验加成）','sys');

}

/* ================= 金币用途：财神供奉 / 技能训练 ================= */
const FORTUNE_MAX_LEVEL = 60;
/* 供奉财神：每升一级所需金币指数上升（×1.5），提供永久全局加成 */
function fortuneCost(nextLevel){ return Math.floor(500 * Math.pow(1.6, nextLevel-1)); }
function fortuneLevel(){ return state.fortune.level || 0; }
function fortuneBonus(type){
  const lv=fortuneLevel();
  if(lv<=0) return 0;
  switch(type){
    case 'gold':     return lv * 0.05;              // 每级 +5% 金币
    case 'xp':       return Math.floor(lv/3) * 0.01; // 每 3 级 +1% 经验
    case 'speed':    return Math.floor(lv/5) * 0.02; // 每 5 级 +2% 采集生产速度
    case 'dmg':      return Math.floor(lv/10) * 0.03;// 每 10 级 +3% 战斗伤害
    case 'def':      return Math.floor(lv/15) * 0.02;// 每 15 级 +2% 减伤
    case 'atkspeed': return Math.floor(lv/20) * 0.02;// 每 20 级 +2% 攻速
    default: return 0;
  }
}
function fortuneDesc(lv){
  if(lv<=0) return '尚未供奉，供奉后获得永久全局加成';
  const parts=[];
  if(fortuneBonus('gold')>0) parts.push('💰 金币 +'+Math.round(fortuneBonus('gold')*100)+'%');
  if(fortuneBonus('xp')>0) parts.push('⭐ 经验 +'+Math.round(fortuneBonus('xp')*100)+'%');
  if(fortuneBonus('speed')>0) parts.push('⚡ 采集生产速度 +'+Math.round(fortuneBonus('speed')*100)+'%');
  if(fortuneBonus('dmg')>0) parts.push('💥 伤害 +'+Math.round(fortuneBonus('dmg')*100)+'%');
  if(fortuneBonus('def')>0) parts.push('🛡️ 减伤 +'+Math.round(fortuneBonus('def')*100)+'%');
  if(fortuneBonus('atkspeed')>0) parts.push('⚡ 攻速 +'+Math.round(fortuneBonus('atkspeed')*100)+'%');
  return parts.join('　') || '加成生效中';
}
function worshipFortune(){
  const lv=fortuneLevel();
  if(lv>=FORTUNE_MAX_LEVEL){ toast('财神供奉已满级 '+FORTUNE_MAX_LEVEL+' 级'); return; }
  const nextLv=lv+1, cost=fortuneCost(nextLv);
  if(state.gold<cost){ toast('金币不足（供奉需 '+fmt(cost)+' 金币）'); return; }
  state.gold-=cost;
  state.fortune.level=nextLv;
  toast('🙏 财神供奉升至 '+nextLv+' 级，金币加成 +'+Math.round(fortuneBonus('gold')*100)+'%');
  pushLog('🙏 财神供奉：'+nextLv+' 级（'+fortuneDesc(nextLv)+'）','loot');
  checkAchievements();
  saveState(); renderAll();
}
/* 技能速成训练：花费金币直接提升 1 级，价格随等级指数上升 */
function trainCost(skillId){ const L=lvl(skillId); return Math.floor(100 * Math.pow(1.5, L-1)); }
function trainSkill(skillId){
  const s=state.skills[skillId];
  if(!s) return;
  if(s.level>=99){ toast(SKILL_MAP[skillId].name+' 已满级'); return; }
  const cost=trainCost(skillId);
  if(state.gold<cost){ toast('金币不足（训练需 '+fmt(cost)+' 金币）'); return; }
  state.gold-=cost;
  const need=xpForLevel(s.level+1);
  s.xp+=need;
  state.stats.relicSkillXp[skillId]=(state.stats.relicSkillXp[skillId]||0)+need;
  const after=levelFromXp(s.xp);
  s.level=after;
  toast('📚 '+SKILL_MAP[skillId].name+' 训练完成，升至 '+after+' 级');
  pushLog('📚 技能训练：'+SKILL_MAP[skillId].name+' → '+after+' 级','loot');
  checkAchievements(); updateTasks('level',{skillId});
  saveState(); renderAll();
}
function trainSelected(){
  const sel=document.getElementById('train-skill');
  if(!sel || !sel.value) return;
  trainSkill(sel.value);
}

function startAction(skillId, actionId){
  const a=getAction(skillId, actionId);
  if(!a) return;
  if(lvl(skillId)<a.lvl){ toast('需要 '+SKILL_MAP[skillId].name+' '+a.lvl+' 级'); return; }
  if(a.in && !hasItems(a.in)){ toast('材料不足'); return; }
  state.activeSkill=skillId;
  state.combat.active=false;
  state.action={skillId, actionId, progress:0};
  pushLog('开始：'+a.name,'sys');
  saveState(); renderAll();
}
function stopAction(){
  if(state.action){ pushLog('停止：'+getAction(state.action.skillId,state.action.actionId).name,'sys'); state.action=null; saveState(); renderAll(); }
}
function completeAction(silent, report){
  const a=getAction(state.action.skillId, state.action.actionId);
  if(!a) return false;
  if(a.in && !hasItems(a.in)){ if(!silent){ toast('材料不足，已停止'); pushLog('材料不足，自动停止','sys');} state.action=null; return false; }
  // 工具类材料：优先消耗背包，若装备中正好是所需工具则一并消耗（升级装备中的工具）
  let consumedEquippedSkill=null;
  if(a.in){
    for(const k in a.in){
      let need=a.in[k];
      if(TOOLS[k]){
        const fromBank=Math.min(countItem(k), need);
        if(fromBank>0) removeItem(k, fromBank);
        need-=fromBank;
        if(need>0 && state.tools[TOOLS[k].skillId]===k){ delete state.tools[TOOLS[k].skillId]; need--; consumedEquippedSkill=TOOLS[k].skillId; }
      } else removeItem(k, a.in[k]);
    }
  }
  if(a.out){
    for(const o of a.out){
      if(o.eq){
        if(report) report.itemGain(o.eq, o.qty||1);
        else { addItem(o.eq, o.qty||1); if(!silent) pushLog('制作完成：'+EQUIPMENT[o.eq].name,'loot'); }
      } else {
        let produced=false;
        if(o.chance===undefined || Math.random()<=o.chance){ produced=true; if(report) report.itemGain(o.id, o.qty||1); else addItem(o.id, o.qty||1); }
        // 升级装备中的工具：自动装备产出新工具
        if(produced && TOOLS[o.id] && consumedEquippedSkill===TOOLS[o.id].skillId && !state.tools[consumedEquippedSkill]){
          if(report){ state.tools[consumedEquippedSkill]=o.id; }
          else { removeItem(o.id, 1); state.tools[consumedEquippedSkill]=o.id; if(!silent) toast('已自动装备 '+TOOLS[o.id].name); }
        }
        if(produced){
          if(!silent){
            updateTasks('collect', {itemId:o.id, qty:o.qty||1});
            RELICS.forEach(r=>{ if(!state.relics[r.id] && r.obtain.type==='produce' && r.obtain.produceItem===o.id){ state.stats.relicProduce[r.id]=(state.stats.relicProduce[r.id]||0)+1; } });
          }
        }
      }
    }
  }
  const xpAmt=a.xp*actionXpMult(state.action.skillId);
  if(report) report.xpGain(state.action.skillId, xpAmt);
  else addXp(state.action.skillId, xpAmt, silent);
  if(!silent){
    const grp=SKILL_MAP[state.action.skillId].group;
    if(grp==='采集') state.stats.gather++; else if(grp==='生产') state.stats.craft++;
    // 神器碎片掉落（采集 5 阶资源）
    RELICS.forEach(r=>{
      if(state.relics[r.id] || r.obtain.type!=='fragment') return;
      if((r.obtain.dropFrom||[]).includes(a.id) && Math.random()<r.obtain.chance){
        addItem(r.obtain.shardId, 1);
        pushLog('✨ 掉落神器碎片：'+ITEMS[r.obtain.shardId].name+'！','loot');
        toast('✨ 获得 '+ITEMS[r.obtain.shardId].name+'！');
      }
    });
    // 本职业特有道具掉落（0.001%）
    if(Math.random()<0.00001) dropTrophy(state.action.skillId);
    checkRelics();
    checkAchievements(); updateTasks('gold',{});
  }
  return true;
}

/* ================= 战斗 ================= */
function playerStats(){
  const style=state.combat.style;
  const slv=lvl(style);
  const dlv=lvl('defence');
  const hlv=lvl('hitpoints');
  let wdmg=0, def=0, hp=0, accDmg=0;
  const wpnId=state.equipment['weapon'];
  if(wpnId){ const wpn=EQUIPMENT[wpnId], m=eqStatMult(wpnId); wdmg += Math.floor(((wpn.style===style)? wpn.stats.damage : Math.floor(wpn.stats.damage*0.25))*m); }
  for(const slot of ['head','body','legs']){
    const id=state.equipment[slot]; if(id){ const e=EQUIPMENT[id], m=eqStatMult(id); def+=Math.floor(e.stats.defence*m); hp+=Math.floor(e.stats.hp*m); }
  }
  const accId=state.equipment['accessory']; if(accId){ const acc=EQUIPMENT[accId], m=eqStatMult(accId); accDmg+=Math.floor(acc.stats.damage*m); hp+=Math.floor(acc.stats.hp*m); }
  const pouchId=state.equipment['pouch']; if(pouchId){ hp+=Math.floor(EQUIPMENT[pouchId].stats.hp*eqStatMult(pouchId)); }
  const maxHit=Math.floor((4+slv*1.4+wdmg+accDmg)*buffMult('dmg')*(1+passiveGlobal('dmg')+petBonus('dmg')+achievementBonus('dmg')+relicBonus('dmg')+relicBonus('styleDmg', style)+fortuneBonus('dmg')+permaBonus('dmg')));
  const accuracy=Math.min(0.97, (0.75+slv*0.003+passiveGlobal('acc')+achievementBonus('acc')+relicBonus('acc')+permaBonus('acc'))*buffMult('acc'));
  const reduction=dlv*0.35+def*0.5;
  const maxHP=Math.floor((20+hlv*4+hp)*(1+passiveGlobal('hp')+petBonus('hp')+achievementBonus('hp')+relicBonus('hp')+permaBonus('hp'))*buffMult('hp'));
  const baseInterval = style==='melee'?2.4 : style==='ranged'?2.6 : 2.8;
  const atkInterval=baseInterval/(buffMult('atkspeed')*(1+petBonus('atkspeed')+achievementBonus('atkspeed')+relicBonus('atkspeed')+fortuneBonus('atkspeed')+permaBonus('atkspeed')));
  return {maxHit, accuracy, reduction, maxHP, atkInterval, styleLevel:slv};
}
function setStyle(style){ state.combat.style=style; renderAll(); }
function startCombat(monsterId){
  const m=MONSTER_MAP[monsterId];
  state.action=null;
  state.activeSkill=state.combat.style; // 切到战斗风格对应技能视图
  state.combat.active=true;
  state.combat.monsterId=monsterId;
  state.combat.monsterHp=m.hp;
  state.combat.atkTimer=0; state.combat.monTimer=0; state.combat.petTimer=0;
  const ps=playerStats();
  if(state.combat.playerHp<=0) state.combat.playerHp=ps.maxHP;
  pushLog('遭遇 '+m.name+'！','sys');
  saveState(); renderAll();
}
function stopCombat(){ state.combat.active=false; pushLog('脱离战斗','sys'); saveState(); renderAll(); }
function pushLog(text, cls){ state.log.unshift({text, cls, t:Date.now()}); if(state.log.length>60) state.log.length=60; }
function autoEatIfNeeded(){
  const food=state.combat.autoEat;
  if(!food) return;
  const it=ITEMS[food]; if(!it || !it.heal) return;
  const ps=playerStats();
  const pct=state.combat.playerHp/ps.maxHP*100;
  if(pct<=state.combat.threshold && countItem(food)>0){
    removeItem(food,1);
    state.combat.playerHp=Math.min(ps.maxHP, state.combat.playerHp+it.heal);
    pushLog('自动进食 '+it.name+' +'+it.heal,'sys');
  }
}
function playerAttack(){
  const m=MONSTER_MAP[state.combat.monsterId];
  const ps=playerStats();
  if(Math.random()<ps.accuracy){
    const dmg=Math.max(1, Math.floor(rnd(0.5,1)*ps.maxHit));
    state.combat.monsterHp-=dmg;
    pushLog('你对 '+m.name+' 造成 '+dmg+' 点伤害','me');
    if(state.combat.monsterHp<=0) onMonsterDefeated();
  } else pushLog('你的攻击未命中','sys');
}
function petAttack(){
  const p=activePet(); if(!p || !state.combat.active) return;
  const m=MONSTER_MAP[state.combat.monsterId];
  if(!m) return;
  if(Math.random()<p.accuracy){
    const dmg=Math.max(1, Math.floor(rnd(0.6,1)*petDamage()));
    state.combat.monsterHp-=dmg;
    const sd=petStageDef(p);
    pushLog(sd.icon+' '+sd.name+' 对 '+m.name+' 造成 '+dmg+' 点伤害','pet');
    if(state.combat.monsterHp<=0) onMonsterDefeated();
  } else pushLog(petStageDef(p).name+' 的攻击未命中','sys');
}
function monsterAttack(){
  const m=MONSTER_MAP[state.combat.monsterId];
  const ps=playerStats();
  const raw=Math.max(1, Math.floor((m.maxHit-ps.reduction)*rnd(0.85,1.05)));
  const dmg=Math.max(1, Math.floor(raw/buffMult('def')*Math.max(0, 1-passiveGlobal('def')-petBonus('def')-achievementBonus('def')-relicBonus('def')-fortuneBonus('def')-permaBonus('def'))));
  state.combat.playerHp-=dmg;
  state.stats.relicDmgTaken=(state.stats.relicDmgTaken||0)+dmg;
  addXp('hitpoints', Math.max(1,Math.floor(dmg*0.3)), true);
  addXp('defence', Math.max(1,Math.floor(dmg*0.15)), true);
  pushLog(m.name+' 对你造成 '+dmg+' 点伤害','mo');
  autoEatIfNeeded();
  if(state.combat.playerHp<=0) onPlayerDefeated();
}
function onMonsterDefeated(){
  const m=MONSTER_MAP[state.combat.monsterId];
  state.totalKills++;
  state.stats.kills[m.id]=(state.stats.kills[m.id]||0)+1;
  const style=state.combat.style;
  addXp(style, m.xp, true);
  addXp('defence', Math.floor(m.xp*0.7), true);
  addXp('hitpoints', Math.floor(m.xp*0.5), true);
  addGold(m.gold);
  pushLog('击败 '+m.name+'！+'+m.gold+' 金币','loot');
  // 掉落
  for(const d of m.drops){
    if(Math.random()<d.chance){
      const q=rint(d.qty[0], d.qty[1]);
      addItem(d.id, q);
      const dropName=EQUIPMENT[d.id]?EQUIPMENT[d.id].name:ITEMS[d.id].name;
      pushLog('掉落：'+dropName+' ×'+q,'loot');
    }
  }
  // 神器 Boss 掉落
  RELICS.forEach(r=>{
    if(state.relics[r.id] || r.obtain.type!=='bossDrop') return;
    if(r.obtain.monsterId===m.id && Math.random()<r.obtain.chance) activateRelic(r.id);
  });
  // 战斗职业特有道具掉落（0.001%：风格 / 防御 / 生命）
  if(Math.random()<0.00001) dropTrophy(style);
  if(Math.random()<0.00001) dropTrophy('defence');
  if(Math.random()<0.00001) dropTrophy('hitpoints');
  // 重生同种怪
  state.combat.monsterHp=m.hp;
  state.combat.atkTimer=0;
  autoEatIfNeeded();
  updateTasks('kill', {monsterId:m.id});
  updateTasks('gold', {});
  checkAchievements();
  checkRelics();
}
function onPlayerDefeated(){
  state.combat.active=false;
  state.combat.playerHp=playerStats().maxHP;
  pushLog('你倒下了……已在营地复活','sys');
  toast('💀 你被击败了，已复活');
}
function combatTick(dt){
  if(!state.combat.active) return;
  const m=MONSTER_MAP[state.combat.monsterId];
  if(!m) return;
  state.combat.atkTimer-=dt;
  state.combat.monTimer-=dt;
  if(activePet()) state.combat.petTimer=(state.combat.petTimer||0)-dt;
  if(state.combat.atkTimer<=0){ playerAttack(); state.combat.atkTimer+=playerStats().atkInterval; }
  if(state.combat.active && activePet() && state.combat.petTimer<=0){ petAttack(); state.combat.petTimer+=petAtkInterval(); }
  if(state.combat.active && state.combat.monTimer<=0){ monsterAttack(); state.combat.monTimer+=m.interval; }
}

/* ================= 离线收益 ================= */
function simulateOffline(){
  const now=Date.now();
  const dt=now-state.lastSave;
  if(dt<30*1000) return null;
  state.lastSave=now;
  state.stats.offlines++;
  let seconds=dt/1000;
  const report={seconds, items:{}, xp:{}, gold:0, kills:0};
  // 技能动作离线
  if(state.action){
    const a=getAction(state.action.skillId, state.action.actionId);
    if(a){
      const speedMult=actionSpeedMult(state.action.skillId);
      const cost=a.time/speedMult;
      let remaining=Math.min(seconds, 12*3600);
      let guard=0;
      while(remaining>=cost && guard<200000){
        if(a.in && !hasItems(a.in)) break;
        remaining-=cost;
        completeAction(true, {
          itemGain:(id,q)=>{ report.items[id]=(report.items[id]||0)+q; },
          xpGain:(sid,x)=>{ report.xp[sid]=(report.xp[sid]||0)+x; },
        });
        guard++;
      }
      state.action.progress=0;
      if(remaining>0) state.action.progress=remaining/cost; // 保留小数进度
      else if(state.action && a.in && !hasItems(a.in)) state.action=null;
    }
  }
  // 战斗离线（上限2小时，粗略模拟）
  if(state.combat.active){
    const m=MONSTER_MAP[state.combat.monsterId];
    if(m){
      const ps=playerStats();
      const cs=Math.min(seconds, 2*3600);
      const pdmg=Math.max(1, ps.maxHit*0.75*ps.accuracy);
      const petDPS=activePet()?petDamage()*0.8*activePet().accuracy/petAtkInterval():0;
      const totalDPS=pdmg/ps.atkInterval+petDPS;
      const killTime=Math.max(0.3, m.hp/totalDPS);
      const mdmg=Math.max(1,(m.maxHit-ps.reduction)*0.95);
      const surv=(ps.maxHP*1.5)/Math.max(0.001, mdmg/m.interval);
      let kills=Math.floor(cs/killTime);
      kills=Math.min(kills, Math.floor(surv/killTime), 20000);
      if(kills>0){
        report.kills=kills;
        const style=state.combat.style;
        report.xp[style]=(report.xp[style]||0)+m.xp*kills;
        report.xp.defence=(report.xp.defence||0)+Math.floor(m.xp*0.7)*kills;
        report.xp.hitpoints=(report.xp.hitpoints||0)+Math.floor(m.xp*0.5)*kills;
        report.gold=m.gold*kills;
        for(const d of m.drops){
          const expected=Math.floor(d.chance*kills);
          if(expected>0){ report.items[d.id]=(report.items[d.id]||0)+expected*Math.round((d.qty[0]+d.qty[1])/2); }
        }
        state.totalKills+=kills;
      }
    }
  }
  // 应用离线收益
  for(const id in report.items) addItem(id, report.items[id]);
  for(const sid in report.xp) addXp(sid, report.xp[sid], true);
  addGold(report.gold);
  checkAchievements();
  return report;
}

function achievementBonus(type){

/* ================= 任务系统 ================= */
function taskName(t){
  if(t.type==='collect') return '收集 '+ITEMS[t.itemId].icon+' '+ITEMS[t.itemId].name+' ×'+t.qty;
  if(t.type==='kill') return '击败 '+MONSTER_MAP[t.monsterId].icon+' '+MONSTER_MAP[t.monsterId].name+' ×'+t.qty;
  if(t.type==='gold') return '持有 '+fmt(t.qty)+' 金币';
  if(t.type==='level') return SKILL_MAP[t.skillId].icon+' '+SKILL_MAP[t.skillId].name+' 达到 '+t.qty+' 级';
  return '';
}
function taskDone(t){
  if(t.type==='collect' || t.type==='kill') return t.progress>=t.qty;
  if(t.type==='gold') return state.gold>=t.qty;
  if(t.type==='level') return lvl(t.skillId)>=t.qty;
  return false;
}
function generateTask(){
  const tl=totalLevel();
  const id='t'+Math.random().toString(36).slice(2,9);
  const roll=Math.random();
  if(roll<0.35){
    const tier=Math.random()<0.7?1:2;
    const line=pick(['milk','fiber','log','ore','fish']);
    const itemId=line+tier;
    const qty=rint(4, 8+Math.floor(tl/8));
    return {id, type:'collect', itemId, qty, progress:0, reward:ITEMS[itemId].val*qty*2+30};
  } else if(roll<0.6){
    const maxLvl=Math.max(lvl('melee'),lvl('ranged'),lvl('magic'))+3;
    const pool=MONSTERS.filter(m=>m.lvl<=maxLvl).slice(0,6);
    const m=pick(pool.length?pool:MONSTERS);
    const qty=rint(2,5);
    return {id, type:'kill', monsterId:m.id, qty, progress:0, reward:m.gold*qty*2+30};
  } else if(roll<0.8){
    const qty=Math.min(200000, 100*Math.pow(2, Math.min(9, Math.floor(tl/12)+1)));
    return {id, type:'gold', qty, progress:0, reward:Math.max(30, Math.floor(qty*0.25))};
  } else {
    const s=pick(SKILLS);
    const target=Math.min(99, lvl(s.id)+rint(2,5));
    return {id, type:'level', skillId:s.id, qty:target, progress:0, reward:120*target};
  }
}
function updateTasks(event, payload){
  let anyDone=false;
  state.tasks.forEach(t=>{
    if(t.done) return;
    if(event==='collect' && t.type==='collect' && payload.itemId===t.itemId){ t.progress+=payload.qty; }
    else if(event==='kill' && t.type==='kill' && payload.monsterId===t.monsterId){ t.progress++; }
    else if(event==='gold' && t.type==='gold'){ t.progress=Math.min(t.qty, state.gold); }
    else if(event==='level' && t.type==='level' && payload.skillId===t.skillId){ t.progress=Math.min(t.qty, lvl(t.skillId)); }
    if(!t.done && taskDone(t)){
      t.done=true; t.progress=t.qty;
      addGold(t.reward);
      toast('✅ 任务完成：'+taskName(t)+'（+'+fmt(t.reward)+' 金币）');
      pushLog('✅ 任务完成：'+taskName(t),'loot');
      anyDone=true;
    }
  });
  if(anyDone){ refreshDoneTasks(); saveState(); }
}
function refreshDoneTasks(){ state.tasks=state.tasks.map(t=> t.done? generateTask() : t); }
function refreshTasks(){ state.tasks=[generateTask(), generateTask(), generateTask()]; saveState(); renderRight(); }

function renderBank(body){

  let html=`<div class="bank-head"><b>🎒 背包</b><span class="cnt">${keys.length} 种 · ${fmt(total)} 件</span></div>

    <div class="bank-grid" id="bank-grid"></div>`;
  body.innerHTML=html;
  const grid=$('#bank-grid');
  const search=$('#bank-search');
  function draw(){
    const q=(search.value||'').trim();
    const list=keys.filter(k=>!q || ITEMS[k].name.includes(q));
    if(!list.length){ grid.innerHTML=`<div class="bank-empty">${q?'没有匹配的物品':'背包空空如也'}</div>`; return; }
    grid.innerHTML=list.map(k=>{
      const it=ITEMS[k], isEq=!!EQUIPMENT[k], isTool=!!TOOLS[k], isTrophy=it.cat==='trophy';
      const qty=state.bank[k];
      return `<div class="bank-item" onmouseenter="tipItem(event,'${k}')" onmouseleave="untip()" onclick="clickBank('${k}')">

        <span class="q">${fmt(qty)}</span>

    }).join('');
  }
  search.addEventListener('input', draw); draw();
}

function sellItem(id, qty){
  const have=countItem(id); if(have<=0) return;
  const n=qty===0?have:Math.min(qty,have);
  const val=ITEMS[id].val;
  removeItem(id,n); addGold(val*n);
  state.stats.sold+=n;
  toast('出售 '+ITEMS[id].name+' ×'+n+'，+'+fmt(val*n)+' 金币');
  updateTasks('gold',{}); checkAchievements();
  saveState(); renderRight();
}

      <div class="f-bonus">上交采矿/钓鱼的<b>低概率产物</b>换取<b>永久</b>全局加成，单次需求随供奉次数递增；0.001% 特有道具不可供奉。</div>

function buyItem(id){

/* ================= 宠物渲染 ================= */
function petBonusText(p){
  const lv=state.pets[p.id].level;
  const sd=petStageDef(p);
  const map={speed:['采集效率','+'],xp:['全局经验','+'],gold:['全局金币','+'],dmg:['战斗伤害','+'],hp:['生命上限','+'],def:['减伤','+'],atkspeed:['攻速','+']};
  const parts=[];
  for(const k in p.bonus){
    const v=Math.round(p.bonus[k]*lv*(sd.bonusMult||1)*100);
    if(v>0) parts.push(map[k][0]+' '+map[k][1]+v+'%');
  }
  return parts.join(' · ') || '加成随等级成长';
}
function renderPets(body){
  const ap=activePet();
  let html='<h3 class="section-title" style="margin-top:0">🐾 宠物</h3>';
  if(ap){
    const pd=state.pets[ap.id];
    const sd=petStageDef(ap);
    const need=pd.level<PET_MAX_LEVEL?petXpNeed(pd.level):0;
    const pct=pd.level<PET_MAX_LEVEL?Math.min(100,pd.xp/need*100):100;
    html+=`<div class="pet-active">
      <div class="pa-face">${sd.icon}</div>
      <div class="pa-info">
        <b>${sd.name} <span class="tag">${pd.level}级 · ${petStage(ap)}阶</span></b>
        <small>${ap.desc}</small>
        <div class="pet-bar"><i style="width:${pct}%"></i></div>
        <span class="pa-xp">${pd.level>=PET_MAX_LEVEL?'已满级':pd.xp+' / '+need+' 经验'}</span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="setActivePet('${ap.id}')">收回</button>
    </div>`;
  } else {
    html+=`<div class="pet-active empty">尚未出战的宠物。选择下方宠物出战，可提供属性加成并自动参战。</div>`;
  }
  html+=`<div class="pet-list">`;
  PETS.forEach(p=>{
    const pd=state.pets[p.id];
    const owned=pd.owned;
    const isActive=state.activePet===p.id;
    if(owned){
      const sd=petStageDef(p);
      const st=petStage(p);
      const need=pd.level<PET_MAX_LEVEL?petXpNeed(pd.level):0;
      const pct=pd.level>=PET_MAX_LEVEL?100:Math.min(100,pd.xp/need*100);
      let evolveHtml='', evolveBtn='';
      if(st<petMaxStage(p)){
        const next=p.evolutions[st];
        const items=Object.entries(next.cost.items).map(([id,q])=>ITEMS[id].icon+'×'+q).join(' ');
        const canEvolve = pd.level>=next.level && state.gold>=next.cost.gold && hasItems(next.cost.items);
        evolveHtml=`<div class="pc-evolve">⬆️ ${next.icon} ${next.name}（${next.level}级 · ${fmt(next.cost.gold)}金 · ${items}）</div>`;
        evolveBtn=`<button class="btn ${canEvolve?'btn-primary':'btn-ghost'} btn-sm" onclick="evolvePet('${p.id}')">🦋 进化</button>`;
      } else {
        evolveHtml=`<div class="pc-evolve max">✨ 已达成最终形态</div>`;
      }
      html+=`<div class="pet-card ${isActive?'active':''}">
        <div class="pc-face">${sd.icon}</div>
        <div class="pc-info">
          <div class="pc-name">${sd.name} <span class="lv">${pd.level}级 · ${st}阶</span></div>
          <div class="pc-desc">${p.desc}</div>
          <div class="pet-bar"><i style="width:${pct}%"></i></div>
          <div class="pc-bonus">${petBonusText(p)}</div>
          ${evolveHtml}
        </div>
        <div class="pc-actions">
          ${isActive?`<button class="btn btn-ghost btn-sm" onclick="setActivePet('${p.id}')">收回</button>`:`<button class="btn btn-primary btn-sm" onclick="setActivePet('${p.id}')">出战</button>`}
          <button class="btn btn-ghost btn-sm" onclick="feedPet('${p.id}')">🍖 喂食</button>
          ${evolveBtn}
        </div>
      </div>`;
    } else {
      const u=p.unlock;
      const itemDesc=Object.entries(u.items).map(([id,q])=>ITEMS[id].icon+' '+ITEMS[id].name+' ×'+q).join('、');
      const canUnlock=state.gold>=u.gold && hasItems(u.items);
      html+=`<div class="pet-card locked">
        <div class="pc-face" style="filter:grayscale(1);opacity:.5">${p.icon}</div>
        <div class="pc-info">
          <div class="pc-name">${p.name} <span class="lv">未解锁</span></div>
          <div class="pc-desc">${p.desc}</div>
          <div class="pc-bonus">解锁：${fmt(u.gold)} 金币 + ${itemDesc}</div>
        </div>
        <div class="pc-actions"><button class="btn ${canUnlock?'btn-primary':'btn-ghost'} btn-sm" onclick="unlockPet('${p.id}')">🔓 解锁</button></div>
      </div>`;
    }
  });
  html+=`</div>`;
  body.innerHTML=html;
}

/* ================= Tooltip / Toast / Modal ================= */
function tipItem(ev, id){
  const it=ITEMS[id]; if(!it) return;
  let inner=`<div class="tt-title">${it.icon} ${esc(it.name)}</div>`;
  if(EQUIPMENT[id]){ const E=EQUIPMENT[id]; const el=eqEnchant(id); const m=eqStatMult(id); inner+=`<div class="tt-desc">${E.lvl}级装备${el>0?' · 强化 +'+el:''}<br>伤害 <span class="tt-stat">+${Math.floor(E.stats.damage*m)}</span> · 防御 <span class="tt-stat">+${Math.floor(E.stats.defence*m)}</span> · 生命 <span class="tt-stat">+${Math.floor(E.stats.hp*m)}</span><br>售价 ${fmt(E.val)} 金币</div>`; }
  else if(TOOLS[id]){ const T=TOOLS[id]; inner+=`<div class="tt-desc">${SKILL_MAP[T.skillId].name} 工具 · ${T.lvl}级<br>效率 <span class="tt-stat">+${Math.round((T.speed-1)*100)}%</span> · 经验 <span class="tt-stat">+${Math.round((T.xp-1)*100)}%</span><br>售价 ${fmt(T.val)} 金币</div>`; }
  else if(it.heal) inner+=`<div class="tt-desc">恢复 <span class="tt-stat">${it.heal}</span> 生命<br>售价 ${fmt(it.val)} 金币</div>`;
  else if(it.skillBuff) inner+=`<div class="tt-desc">${SKILL_MAP[it.skillId].name}加成 <span class="tt-stat">效率+${Math.round((it.speed-1)*100)}% 经验+${Math.round((it.xp-1)*100)}%</span>，持续 ${fmtTime(it.dur)}</div>`;
  else if(it.buff) inner+=`<div class="tt-desc">${BUFF_INFO[it.buff].desc} <span class="tt-stat">+${Math.round((it.mult-1)*100)}%</span>，持续 ${fmtTime(it.dur)}</div>`;
  else if(it.cat==='relic') inner+=`<div class="tt-desc">神器碎片，集齐后可合成毕业神器<br>售价 ${fmt(it.val)} 金币</div>`;
  else if(it.cat==='trophy') inner+=`<div class="tt-desc">职业特有道具（0.001% 掉落）<br>${esc(it.desc)}<br>出售 <span class="tt-stat">${fmt(it.val)}</span> 金币 · 可制作神器</div>`;
  else inner+=`<div class="tt-desc">${it.cat==='resource'?'采集资源':it.cat==='material'?(it.name.includes('强化石')?'强化材料':'加工材料'):it.cat==='tool'?'工具':'消耗品'}<br>售价 ${fmt(it.val)} 金币</div>`;
  showTip(inner, ev);
}
function showTip(html, ev){
  const t=$('#tooltip'); t.innerHTML=html; t.style.display='block';
  const x=ev.clientX+14, y=ev.clientY+12;
  const r=t.getBoundingClientRect();
  t.style.left=(x+r.width>window.innerWidth-8?x-r.width-16:x)+'px';
  t.style.top=(y+r.height>window.innerHeight-8?y-r.height-16:y)+'px';
}
function untip(){ $('#tooltip').style.display='none'; }
function toast(msg){
  const box=$('#toasts'); const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  box.appendChild(d); setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(()=>d.remove(),320); }, 2600);
  if(box.children.length>4) box.firstChild.remove();
}
function showModal(title, html){
  $('#modal').innerHTML=`<h2>${title}</h2>${html}`;
  $('#modal-wrap').classList.add('show');
}
function closeModal(){ $('#modal-wrap').classList.remove('show'); }
$('#modal-wrap').addEventListener('click', e=>{ if(e.target.id==='modal-wrap') closeModal(); });

/* ================= 主循环 ================= */
/* 使用 setInterval 心跳：后台标签页 rAF 会暂停，而 interval 仍按约 1s 触发，保证放置挂机不中断 */
let lastTick=Date.now();
let lastRender=0;
function tick(){
  const now=Date.now();
  const dt=Math.min((now-lastTick)/1000, 1.5); lastTick=now;
  // 技能动作
  if(state.action && !state.combat.active){
    const a=getAction(state.action.skillId, state.action.actionId);
    if(a){
      const speedMult=actionSpeedMult(state.action.skillId);
      state.action.progress+=dt/(a.time/speedMult);
      let guard=0;
      while(state.action && state.action.progress>=1 && guard<100){
        state.action.progress-=1;
        completeAction(false, null);
        guard++;
      }
      if(state.action && state.action.progress<0) state.action.progress=0;
    }
  }
  // 战斗
  combatTick(dt);
  // 脱战回血
  if(!state.combat.active){
    const ps=playerStats();
    if(state.combat.playerHp<ps.maxHP) state.combat.playerHp=Math.min(ps.maxHP, state.combat.playerHp+ps.maxHP/12*dt);
  }
  // 神器解锁检查（碎片集齐/产出累计/受击累计/经验累计）
  checkRelics();
  // 节流渲染（后台标签页跳过渲染，省 CPU；回到前台立即刷新）
  if(!document.hidden && now-lastRender>150){ renderDynamic(); lastRender=now; }
}
setInterval(tick, 250);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ lastTick=Date.now(); renderDynamic(); } });
function renderDynamic(){
  // 只更新变化频繁的部分
  if(COMBAT_SKILLS.includes(state.activeSkill)) renderCombat($('#main'));
  else renderSkill($('#main'));
  renderTopbar();
  // 更新侧边栏技能条
  renderSidebar();
  // 任务面板进度需实时刷新
  if(state.rightTab==='tasks' || state.rightTab==='relics' || state.rightTab==='pets') renderRight();
}
/* ================= 启动 ================= */
function init(){
  $('#btn-save').addEventListener('click', ()=>{ saveState(); toast('已保存 💾'); });
  $('#btn-reset').addEventListener('click', ()=>{
    showModal('重置存档', `<div class="m-sub">确定要删除所有进度并重新开始吗？此操作不可撤销。</div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-danger" onclick="doReset()">确认重置</button></div>`);
  });
  document.querySelectorAll('.rtab').forEach(t=>t.addEventListener('click', ()=>{ state.rightTab=t.dataset.tab; renderRight(); }));
  // 移动端底部导航
  document.querySelectorAll('.mnav').forEach(b=>b.addEventListener('click', ()=>{ switchMobileView(b.dataset.view); }));
  if(window.matchMedia && window.matchMedia('(max-width:860px)').matches){ document.body.classList.add('mv-main'); }
  // 离线收益
  const report=simulateOffline();
  if(report && report.seconds>=30){
    const lines=[];
    lines.push(`离线时长：<b>${fmtTime(report.seconds)}</b>`);
    if(report.kills) lines.push(`击杀怪物：<b>${fmt(report.kills)}</b> 只`);
    if(report.gold) lines.push(`获得金币：<b>${fmt(report.gold)}</b>`);
    const itemLines=Object.entries(report.items).map(([id,q])=>`${ITEMS[id].icon} ${ITEMS[id].name} ×<b>${fmt(q)}</b>`);
    if(itemLines.length) lines.push(`获得物品：${itemLines.join('、')}`);
    const xpLines=Object.entries(report.xp).map(([sid,x])=>`${SKILL_MAP[sid].icon} ${SKILL_MAP[sid].name} +<b>${fmt(x)}</b> 经验`);
    if(xpLines.length) lines.push(`获得经验：${xpLines.join('、')}`);
    showModal('🌙 欢迎回来！离线收益', `<div class="offline-report">${lines.join('<br>')}</div>
      <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">收下啦</button></div>`);
  }
  if(!state.tasks.length) state.tasks=[generateTask(), generateTask(), generateTask()];
  checkRelics();
  checkAchievements();
  renderAll();
  tick();
}
function doReset(){
  store.removeItem(SAVE_KEY);
  state=defaultState();
  state.tasks=[generateTask(), generateTask(), generateTask()];
  closeModal(); renderAll(); toast('存档已重置');
}
window.selectSkill=selectSkill; window.startAction=startAction; window.stopAction=stopAction;
window.startCombat=startCombat; window.stopCombat=stopCombat; window.setStyle=setStyle;
window.equipItem=equipItem; window.unequip=unequip; window.pickEquip=pickEquip;
window.equipTool=equipTool; window.unequipTool=unequipTool; window.pickTool=pickTool;
window.enchantItem=enchantItem; window.equipDetail=equipDetail;
window.setActivePet=setActivePet; window.unlockPet=unlockPet; window.feedPet=feedPet; window.feedPetItem=feedPetItem;
window.evolvePet=evolvePet; window.craftRelic=craftRelic;
window.useConsumable=useConsumable; window.clickBank=clickBank; window.sellItem=sellItem;
window.buyItem=buyItem; window.closeModal=closeModal; window.doReset=doReset;
window.refreshTasks=refreshTasks;
window.tipItem=tipItem; window.untip=untip;
window.cloudSaveToken=cloudSaveToken; window.cloudUpload=cloudUpload; window.cloudDownload=cloudDownload;
window.cloudLogout=cloudLogout; window.doCloudLogout=doCloudLogout;
// 自动存档
setInterval(saveState, 15000);
window.addEventListener('beforeunload', saveState);
init();
</script>
